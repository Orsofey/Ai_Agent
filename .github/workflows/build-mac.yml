# Сборка «Андрей» для macOS на серверах GitHub — Mac не нужен.
#
# Как запустить (с Windows, в браузере):
#   GitHub → вкладка Releases → «Draft a new release» → Tag: v5.2 (любое новое),
#   Target: ветка с программой → «Publish release».
#   Через ~30–40 минут в этом релизе появятся Andrey-AppleSilicon.dmg (и Andrey-Intel.dmg).
# Или: вкладка Actions → «Build macOS app» → «Run workflow» (если этот файл есть в основной ветке).
#
# Подробно: docs/MAC_FOR_FRIEND.md
name: Build macOS app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bundle_llm:
        description: 'Нейросеть внутри образа: none — скачается при первом запуске (образ ~1,3 ГБ)'
        default: none
        type: choice
        options: [none, qwen3-1.7b]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (M1–M4)
            name: AppleSilicon
          - runner: macos-15-intel    # старые Mac на Intel
            name: Intel
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.name == 'Intel' }}
    timeout-minutes: 120
    env:
      # GitHub принимает файлы релиза до 2 ГБ, поэтому основная нейросеть (2,5 ГБ)
      # скачивается у друга автоматически при первом запуске, с прогрессом в окне.
      BUNDLE_LLM: ${{ inputs.bundle_llm || 'none' }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mac.txt

      - name: Проверка импорта
        run: python -c "import app, main, src.desktop.macapi, src.macos; print('ok')"

      - name: Модели речи, голоса и llama.cpp (Metal)
        run: |
          python scripts/download_model.py vad parakeet gigaam piper llama:cpu
          if [ "$BUNDLE_LLM" != "none" ]; then python scripts/download_model.py "llm:$BUNDLE_LLM"; fi

      - name: Сертификат Developer ID (если добавлен в Secrets)
        if: env.MAC_SIGN_IDENTITY != ''
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Сборка Андрей.app
        run: |
          mkdir -p build/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size static/icon-512.png --out build/icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size*2)) $((size*2)) static/icon-512.png --out build/icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
          python -m PyInstaller --noconfirm --clean LocalAIAgent.spec
          BUNDLE_TARGET="dist/Андрей.app/Contents/Resources/models" python scripts/bundle_model.py

      - name: Подпись и образ диска
        run: |
          packaging/macos/package.sh
          mv dist/Andrey.dmg "dist/Andrey-${{ matrix.name }}.dmg"

      - name: Файл в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('mac-build-{0}', github.run_number) }}
          name: ${{ github.event.release.name || format('Андрей для macOS (сборка {0})', github.run_number) }}
          files: dist/Andrey-${{ matrix.name }}.dmg
