<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #0c1426; --card: #15223b; --text: #eaf2ff; --muted: #97a8cc; --accent: #5ef2c2; --bad: #ff6b8b; }
  body { margin: 0; width: 300px; font: 14px system-ui, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: linear-gradient(135deg, #5ef2c2, #6f8bff); color: #03141a; }
  header img { width: 32px; height: 32px; border-radius: 9px; }
  header b { font-size: 16px; }
  main { padding: 14px 16px 16px; display: grid; gap: 10px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--card); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .online .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  input { padding: 9px 11px; border-radius: 9px; border: 1px solid #2a3b5e; background: #0a1120; color: var(--text); font: inherit; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(94,242,194,.2); }
  button { padding: 10px; border: 0; border-radius: 9px; font: 600 14px inherit; cursor: pointer; background: linear-gradient(135deg, #5ef2c2, #6f8bff); color: #03141a; }
  small { color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><b>Андрей</b></header>
<main>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">Проверяю связь…</span></div>
  <label>Код подключения<input id="token" type="password" placeholder="из настроек ассистента" autocomplete="off"></label>
  <label>Порт ассистента<input id="port" type="number" min="1" max="65535" value="5000"></label>
  <button id="save">Подключить</button>
  <small>Код — в ассистенте: Настройки → «Телефон» → «Код подключения». После подключения «Андрей» открывает
    сайты в этом браузере, переключается на уже открытые вкладки и управляет плеерами.</small>
</main>
<script src="popup.js"></script>
</body>
</html>
