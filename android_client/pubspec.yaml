name: local_ai_agent
description: "Андрей — голосовой пульт для ИИ-агента на вашем ПК (локальная сеть)."
publish_to: 'none'
# Версию и номер сборки для магазинов подставляет scripts/build_android.py (--build-name / --build-number).
version: 5.4.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.0
  record: ^7.0.0
  crypto: ^3.0.3
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # Фирменная тема AI Agent: Tektur (заголовки) и JetBrains Mono (текст), лицензия OFL.
  fonts:
    - family: Tektur
      fonts:
        - asset: assets/fonts/Tektur-Medium.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#4C7DFF"
  adaptive_icon_foreground: assets/icon-foreground.png
  min_sdk_android: 23
