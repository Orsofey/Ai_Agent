<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Agent - Вход</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=5">
</head>
<body class="auth-page">
<main class="auth-card">
    <header class="auth-header"><div class="brand-mark">AI</div><h1>Local AI Agent</h1><p>Управление компьютером голосом и текстом</p></header>
    <div class="auth-tabs"><button class="auth-tab active" data-tab="login" type="button">Войти</button><button class="auth-tab" data-tab="register" type="button">Регистрация</button></div>
    <form id="login-form" class="auth-form active">
        <label>Имя пользователя<input id="login-username" autocomplete="username" required></label>
        <label>Пароль<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">Войти</button>
        <div id="login-message" class="form-message"></div>
    </form>
    <form id="register-form" class="auth-form">
        <label>Имя пользователя<input id="register-username" minlength="3" maxlength="40" required></label>
        <label>Email (необязательно)<input id="register-email" type="email"></label>
        <label>Пароль<input id="register-password" type="password" minlength="6" required></label>
        <label>Повторите пароль<input id="register-password-confirm" type="password" minlength="6" required></label>
        <button class="btn btn-primary" type="submit">Создать аккаунт</button>
        <div id="register-message" class="form-message"></div>
    </form>
    <div class="guest-box"><div><b>Не хотите регистрироваться?</b><small>Можно пользоваться агентом без аккаунта. История гостя будет временной.</small></div><button id="guest-btn" class="btn btn-secondary" type="button">Продолжить как гость</button></div>
    <footer class="auth-footer">Все локальные функции выполняются на этом компьютере.</footer>
</main>
<script src="{{ url_for('static', filename='js/auth.js') }}?v=5"></script>
</body>
</html>
